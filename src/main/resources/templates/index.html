<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            background: #243247;
            min-height: 100vh;
            color: white;
            padding: 25px;
        }

        .sidebar h4 {
            margin-bottom: 35px;
        }

        .main-content {
            padding: 35px;
        }

        .stat-card, .table-card {
            border: none;
            border-radius: 12px;
            padding: 20px;
        }

        .sidebar p {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar">
            <h4>Category Manager</h4>
            <p>Dashboard</p>
            <p>Categories</p>
            <p>Products</p>
        </div>

        <div class="col-md-10 main-content">

            <h2>Category Management</h2>
            <p class="text-muted">Manage your product categories</p>

            <div th:if="${success}" class="alert alert-success"
                 th:text="${success}"></div>

            <div class="row mt-4">

                <div class="col-md-4 mb-3">
                    <div class="card stat-card shadow-sm">
                        <h6>Total Categories</h6>
                        <h2 th:text="${totalCategories}">0</h2>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card stat-card shadow-sm">
                        <h6>Active Categories</h6>
                        <h2 th:text="${activeCategories}">0</h2>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card stat-card shadow-sm">
                        <h6>Inactive Categories</h6>
                        <h2 th:text="${inactiveCategories}">0</h2>
                    </div>
                </div>

            </div>

            <div class="card table-card shadow-sm mt-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>All Categories</h4>

                    <a href="/categories/add" class="btn btn-primary">
                        + Add Category
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="category : ${categories}">
                                <td th:text="${category.id}"></td>
                                <td th:text="${category.name}"></td>
                                <td th:text="${category.description}"></td>

                                <td>
                                    <span class="badge"
                                          th:classappend="${category.status == 'Active'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${category.status}">
                                    </span>
                                </td>

                                <td>
                                    <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                                       class="btn btn-sm btn-warning">Edit</a>

                                    <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Are you sure you want to delete this category?')">
                                        Delete
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="5" class="text-center text-muted">
                                    No categories added yet.
                                </td>
                            </tr>

                        </tbody>

                    </table>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
